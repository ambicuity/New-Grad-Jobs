# Configuration for New Grad Jobs Aggregator

# Job filtering settings
filtering:
  # Minimum expected number of companies across all APIs
  min_expected_companies: 200

  # Maximum age of job postings in days
  max_age_days: 60

  # New grad signals to look for in job titles (case insensitive)
  new_grad_signals:
    # Explicit new grad keywords
    - "new grad"
    - "new graduate"
    - "recent graduate"
    - "fresh graduate"
    - "university grad"
    - "college grad"
    - "new college grad"
    - "campus hire"
    - "campus"
    # Bare "graduate" catches "<Role> Graduate (<Team>)" campus-program titles
    # used by ByteDance/TikTok and similar large employers.
    - "graduate"

    # Entry level keywords
    - "entry level"
    - "entry-level"
    - "early career"
    - "early-career"
    - "junior"
    # "Jr." / "Jr" is how many ATS titles abbreviate junior.
    - "jr"
    - "trainee"
    - "associate"
    - "intern conversion"

    # Year-based programs
    # Keep the in-flight cohort years current — 2027 reqs open ~18 months ahead,
    # so they are live now. Mirrored in strong_new_grad_signals below.
    # Bare years match whole numbers only, never inside req ids ("JR-2026-0042").
    - "2024 start"
    - "2025 start"
    - "2026 start"
    - "2027 start"
    - "2025"
    - "2026"
    - "2027"
    - "class of"

    # Level phrases (whole words: "level 1" does not match "Level 10").
    # Bare level tokens (I, II, L3, ...) live in level_signals below.
    - "level 1"
    - "level 2"
    - "level i"
    - "level ii"

    # Programs
    - "graduate program"
    - "rotational program"
    - "development program"
    - "analyst program"
    - "engineering program"

    # Additional common titles
    - "software engineer"
    - "software developer"
    - "data engineer"
    - "data scientist"
    - "machine learning engineer"
    - "ml engineer"
    - "product analyst"
    - "business analyst"
    - "systems engineer"
    - "infrastructure engineer"
    - "security engineer"
    - "network engineer"
    - "devops engineer"
    - "site reliability"
    - "sre"

  # Entry-level markers matched as standalone level TOKENS, not substrings:
  # "Engineer I", "SDE II", "Engineer I/II", "(L3)", "Engineer-II," match;
  # "Alvin I. Goodman", "I/O", "L2/L3" and "L3Harris" do not. (These used to
  # be written " I " / " L3" in new_grad_signals; YAML-padded spaces were
  # silently stripped, so " I " matched every standalone "I".) Never pad a
  # signal with spaces — tests/test_title_signal_boundaries.py enforces it.
  # Level III+ ("Engineer III", "Engineer 3", "Level 4", "L5") is always
  # excluded; level II stays in scope.
  level_signals:
    - "I"
    - "II"
    - "L3"
    - "L4"
    - "E3"
    - "E4"

  # Phrases strong enough to pass WITHOUT a track signal (whole words/years).
  # Generic role titles must never be added here. Defaults live in
  # DEFAULT_STRONG_NEW_GRAD_SIGNALS in scripts/ngj/filters.py.
  strong_new_grad_signals:
    - "new grad"
    - "new graduate"
    - "graduate program"
    - "campus"
    - "university grad"
    - "university graduate"
    - "college grad"
    - "college graduate"
    - "early career"
    - "2025 start"
    - "2026 start"
    - "2027 start"
    - "2025"
    - "2026"
    - "2027"

  # Track signals to look for in job titles (case insensitive, whole words
  # plus inflections: "engineer" matches "Engineering", but "ai" no longer
  # matches "Maintenance" and "ml" no longer matches "HTML")
  track_signals:
    - "software"
    - "engineer"
    - "developer"
    - "programming"
    - "data"
    - "data science"
    - "data scientist"
    - "data engineer"
    - "data analyst"
    - "machine learning"
    - "ml"
    - "ai"
    - "artificial intelligence"
    - "network"
    - "network engineer"
    - "infrastructure"
    - "sre"
    - "site reliability"
    - "site reliability engineer"
    - "devops"
    - "platform"
    - "cloud"
    - "backend"
    - "frontend"
    - "full stack"
    - "fullstack"
    - "quantitative"
    - "quant"
    # Non-software tracks (the board covers every profession). Each word is a
    # role noun that, together with a new-grad signal, identifies an
    # entry-level posting; a bare "Associate" still never passes.
    - "analyst"
    - "designer"
    - "design"
    - "product"
    - "project"
    - "program"
    - "operations"
    - "business"
    - "marketing"
    - "communications"
    - "sales"
    - "account"
    - "finance"
    - "financial"
    - "accounting"
    - "accountant"
    - "audit"
    - "tax"
    - "banking"
    - "consultant"
    - "consulting"
    - "hr"
    - "human resources"
    - "recruiter"
    - "recruiting"
    - "talent"
    - "legal"
    - "paralegal"
    - "compliance"
    - "customer"
    - "support"
    - "supply chain"
    - "logistics"
    - "procurement"
    - "nurse"
    - "nursing"
    - "clinical"
    - "medical"
    - "pharmacist"
    - "therapist"
    - "teacher"
    - "instructor"
    - "policy"
    - "government"
    - "mechanical"
    - "electrical"
    - "civil"
    - "manufacturing"
    - "industrial"
    - "quality"
    - "process"
    - "specialist"
    - "coordinator"
    - "administrator"

  # Exclusion signals - jobs with these keywords are filtered OUT
  exclusion_signals:
    - "senior"
    - "sr."
    - "sr"
    - "staff"
    - "principal"
    - "lead"
    - "manager"
    - "director"
    - "vp"
    - "vice president"
    - "head of"
    - "architect"
    - "distinguished"
    - "fellow"
    - "10+ years"
    - "8+ years"
    - "7+ years"
    - "6+ years"
    - "5+ years"
    # Part-time and seasonal roles are not new-grad careers (owner decision,
    # 2026-10-14). Full-time entry-level store, sales and operations roles stay.
    - "part-time"
    - "part time"
    - "seasonal"
    # "Associate" is a new-grad signal, but these are senior legal and
    # academic roles (bug fix, 2026-10-15).
    - "general counsel"
    - "associate dean"
    - "assistant dean"
    - "associate professor"

  # Internships, co-ops, student placements and banking summer programs.
  # Never in the curated board; published as a "near miss" (reason
  # intern_or_coop) in jobs-extended.json so the site can offer an opt-in
  # toggle. Defaults live in DEFAULT_INTERNSHIP_SIGNALS in scripts/ngj/filters.py.
  internship_signals:
    - "intern"
    - "internship"
    - "co-op"
    - "co op"
    - "coop"
    - "student"
    - "summer analyst"
    - "summer associate"

  # Near-miss tier (jobs-extended.json): postings that pass every hard rule
  # but fail a soft one — internship/co-op, level III+, outside US/CA/IN, or
  # posted between max_age_days and near_miss_max_age_days ago. Capped at
  # max_near_misses, newest first, so the extra payload stays bounded.
  near_miss_max_age_days: 120
  max_near_misses: 4000
