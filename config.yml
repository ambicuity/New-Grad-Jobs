  google:
    # Scrapes the public Google Careers results page (AF_initDataCallback
    # payload; the old /api/v3/search JSON endpoint 404s). Verified working
    # 2026-09-24. Left disabled pending a decision to add Google as a source.
    enabled: false
    max_pages: 3
    # Search terms, one results-page crawl each (up to max_pages pages)
    search_terms:
      - "new graduate software engineer"
      - "entry level software engineer"
      - "junior software engineer"
      - "associate software engineer"
      - "campus graduate engineer"
      - "new grad data scientist"
      - "entry level data engineer"
      - "junior data scientist"

  # Generic GraphQL ingestion path for public careers endpoints
  graphql:
    enabled: false
    max_jobs_per_source: 200
    timeout: 6
    sources:
      # Example source (disabled by default)
      - name: "Example GraphQL Careers"
        endpoint: "https://careers.example.com/graphql"
        query: |
          query Careers($after: String) {
            jobs(first: 50, after: $after) {
              edges {
                node {
                  title
                  applyUrl
                  postedAt
                  description
                  locations {
                    name
                  }
                }
              }
              pageInfo {
                hasNextPage
                endCursor
              }
            }
          }
        variables: {}
        data_path: "data.jobs.edges"
        page_info_path: "data.jobs.pageInfo"
        field_mappings:
          title: "title"
          location: "locations.0.name"
          url: "applyUrl"
          posted_at: "postedAt"
          description: "description"

