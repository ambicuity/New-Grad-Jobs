    # One Workday searchText query per keyword, merged by job path. Replaces
    # the unfiltered listing, which was capped at 200 jobs per company and so
    # dropped most new-grad roles at large tenants (NVIDIA: 2 of ~30). Paging
    # a keyword stops at the first page with no plausible new-grad title (see
    # ngj.sources.workday). Avoid one-letter keywords such as "I": Workday
    # full-text search matches them in almost every posting.
    search_filters:
      title_keywords:
        - "new grad"
        - "graduate"
        - "university"
        - "early career"
        - "entry level"
        - "junior"
        - "associate"
        - "campus"
        - "2026"
        - "2027"
      max_jobs_per_keyword: 200
