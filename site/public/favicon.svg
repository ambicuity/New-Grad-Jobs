<?xml version="1.0" encoding="UTF-8"?>
<!--
  NGJ favicon: the brand badge from the app header (amber #ff9d3d box, bold
  black "NGJ"). System monospace only, so there is no font download and no
  flash in the browser tab.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <rect width="64" height="64" rx="10" fill="#ff9d3d"/>
  <text x="32" y="33" text-anchor="middle" dominant-baseline="central" fill="#000"
        font-family="Menlo, Consolas, 'DejaVu Sans Mono', 'Liberation Mono', ui-monospace, monospace"
        font-size="30" font-weight="700" letter-spacing="1">NGJ</text>
</svg>
