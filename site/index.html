<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NGJ · New Grad Jobs</title>
  <meta name="description" content="Fully automated list of new grad job opportunities from multiple company APIs, updated about every 30 minutes. Built by engineers, for engineers.">
  <link rel="canonical" href="https://jobs.riteshrana.engineer/">

  <meta property="og:type" content="website">
  <meta property="og:site_name" content="NGJ · New Grad Jobs">
  <meta property="og:title" content="NGJ · New Grad Jobs">
  <meta property="og:description" content="Fully automated job board for new graduates powered by multiple live company APIs, updated about every 30 minutes.">
  <meta property="og:url" content="https://jobs.riteshrana.engineer/">
  <meta property="og:image" content="https://jobs.riteshrana.engineer/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="NGJ · New Grad Jobs — live terminal job board for new grads">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="NGJ · New Grad Jobs">
  <meta name="twitter:description" content="Fully automated job board for new graduates powered by multiple live company APIs, updated about every 30 minutes.">
  <meta name="twitter:image" content="https://jobs.riteshrana.engineer/og-image.png">

  <link rel="icon" type="image/svg+xml" href="./favicon.svg">
  <!-- Analytics loads 3 s after window load, so only a DNS hint (no preconnect). -->
  <link rel="dns-prefetch" href="https://gc.zgo.at">
  <link rel="alternate" type="application/rss+xml" title="New Grad Jobs RSS Feed" href="./feed.xml">

  <style>
    html, body { margin: 0; padding: 0; height: 100%; background: #000; color: #e8e8e8;
      font-family: "JetBrains Mono", ui-monospace, monospace;
      -webkit-font-smoothing: antialiased; }
    body { overflow-x: auto; }
    * { box-sizing: border-box; }
    #root { height: 100%; width: 100%; min-width: 1180px; }
    /* Mobile/tablet: drop the desktop 1180px canvas so the single-column reflow
       (driven by useIsMobile in the terminal views) fits the viewport with
       no sideways scroll. Breakpoint mirrors MOBILE_MAX_PX in
       src/hooks/useIsMobile.js — it matches the desktop terminal's 1180px
       min-width, so any screen that can't fit the 3-column layout reflows
       instead of scrolling. */
    @media (max-width: 1180px) {
      body { overflow-x: hidden; }
      #root { min-width: 0; }
    }
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: #0a0a0a; }
    ::-webkit-scrollbar-thumb { background: #2a2a2a; }
    ::-webkit-scrollbar-thumb:hover { background: #3a3a3a; }
    input::placeholder { color: #5a5a5a; }
    button:focus-visible, input:focus-visible { outline: 1px solid #ff9d3d; outline-offset: 1px; }
    .ng-boot { padding: 24px; font-size: 12px; color: #ff9d3d; letter-spacing: 0.6px; }
    .ng-boot .dim { color: #6e6e6e; }
    .ng-notice { margin: 0 24px 16px; padding: 12px 14px; border: 1px solid #ff9d3d; font-size: 12px; line-height: 1.6; }
    .ng-notice a, .ng-static a { color: #ff9d3d; }
    /* Static, crawlable job list (prerendered at build). React replaces it on mount. */
    .ng-static { padding: 0 24px 32px; font-size: 12px; line-height: 1.7; }
    .ng-static h1 { font-size: 13px; font-weight: 600; letter-spacing: 0.6px; color: #e8e8e8; margin: 0 0 8px; }
    .ng-static ol { margin: 0; padding-left: 40px; }
    .ng-static .co { color: #e8e8e8; font-weight: 600; }
    .ng-static .dim { color: #6e6e6e; }
  </style>

  <script src="./boot.js" defer></script>
  <script type="module" src="./src/analytics.js"></script>
</head>
<body>
  <noscript>
    <style>.ng-boot { display: none; }</style>
    <div class="ng-notice" role="note">
      NGJ is an interactive terminal that needs JavaScript. Without it you can still browse:
      the <a href="https://github.com/ambicuity/New-Grad-Jobs#readme">README job tables on GitHub</a>,
      the raw <a href="./jobs.json">jobs.json</a> data, or the <a href="./feed.xml">RSS feed</a>.
      The newest roles are listed below.
    </div>
  </noscript>
  <div id="root">
    <div class="ng-boot">
      <div>NGJ <span class="dim">loading jobs-index.json …</span></div>
    </div>
    <div class="ng-notice" role="alert" data-ngj-boot-fail hidden>
      The job board failed to load. <a href="https://github.com/ambicuity/New-Grad-Jobs#readme">View the jobs on the GitHub README</a>
      or reload the page.
    </div>
    <!--ngj:prerender-->
  </div>
  <script type="module" src="./src/main.jsx"></script>
</body>
</html>
