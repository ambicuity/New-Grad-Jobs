version: 2

# pre-commit hook revisions are not a Dependabot ecosystem; refresh them with
# `pre-commit autoupdate --freeze`.

updates:
  # GitHub Actions ecosystem — grouped to reduce PR noise for the sole maintainer
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "chore(ci)"
    labels:
      - "ci-cd"
      - "automated pr"
    open-pull-requests-limit: 3
    groups:
      # All Actions minor/patch updates in one PR; major bumps arrive individually
      github-actions-minor-patch:
        update-types:
          - "minor"
          - "patch"

  # Python — pyproject.toml ranges + hash-locked requirements*.txt
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "dependencies"
      - "automated pr"
    open-pull-requests-limit: 2
    groups:
      # Bundle all non-major pip updates; major versions still reviewed individually
      pip-minor-patch:
        update-types:
          - "minor"
          - "patch"

  # Site (Vite app under site/)
  - package-ecosystem: "npm"
    directory: "/site"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "dependencies"
      - "automated pr"
    open-pull-requests-limit: 3
    groups:
      npm-minor-patch:
        update-types:
          - "minor"
          - "patch"
