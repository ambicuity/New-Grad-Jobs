name: Update New Grad Jobs

# Scrape → verify → build the site → deploy to GitHub Pages.
#
# Generated data (jobs.json, jobs-index.json, descriptions/, feed.xml,
# health.json) is NOT committed: it is written to site/public/, baked into the
# Vite build and shipped as the Pages artifact. Only the small persistent state
# (README.md job tables/counts and data/market-history.json) is committed back.
# This is the single deployer for the site: site-only changes on main trigger
# it via the push paths below.

on:
  # Every 30 minutes, offset from :00/:30 — GitHub's documented high-load
  # window where scheduled runs are delayed or dropped. scraper-watchdog.yml
  # re-dispatches this workflow if data goes stale because a schedule stops
  # firing.
  schedule:
    - cron: '7,37 * * * *'

  workflow_dispatch:

  # Redeploy when scraper inputs or the site change. The bot's own commits
  # (README.md, data/) are outside these paths and are pushed with
  # GITHUB_TOKEN, which never triggers workflows, so there is no loop.
  push:
    branches: [main]
    paths:
      - scripts/**
      - config.yml
      - requirements.txt
      - site/**
      - .github/workflows/update-jobs.yml

# One run at a time. Queue (don't cancel) so an in-flight scrape is never
# killed minutes before it deploys; GitHub keeps at most one pending run.
concurrency:
  group: update-jobs
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  scrape:
    runs-on: ubuntu-latest
    # Normal runs take a few minutes; the 360-min default would let a hung
    # fetch burn six runner-hours and block every queued run behind it.
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1
          # No token is left in .git/config while third-party scraper
          # dependencies run; the persist job pushes with its own token.
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies (hash-locked)
        run: python -m pip install --require-hashes -r requirements.txt

      - name: Run job scraper
        # Writes site/public/{jobs.json,jobs-index.json,descriptions/,feed.xml,
        # health.json}, README.md and data/market-history.json. Fails the run
        # on write errors or a >40% collapse versus the live site.
        run: python scripts/update_jobs.py

      - name: Verify published artifacts
        run: python scripts/check_integrity.py

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Build site
        working-directory: site
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: site/dist

      - name: Upload persistent state
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: persistent-state
          if-no-files-found: error
          retention-days: 3
          path: |
            README.md
            data/market-history.json

  deploy:
    needs: scrape
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0

  persist:
    needs: scrape
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Pushes over SSH with a write deploy key: main requires status checks and
    # the deploy key is the ruleset's bypass actor (the github-actions app
    # cannot be one on a personal repo). The token itself stays read-only, and
    # this job runs no third-party code.
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1
          ssh-key: ${{ secrets.PERSIST_DEPLOY_KEY }}

      - name: Download persistent state
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: persistent-state
          path: .

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Everything this step publishes. Also the scope of the pre-push
          # conflict-marker guard below.
          PUBLISHED=(README.md data/market-history.json)

          # Commit FIRST, then rebase onto the latest main. `git pull
          # --autostash` exits 0 even when re-applying the stash conflicts, so
          # conflict markers used to be staged and pushed. A plain rebase of
          # our commit stops with a non-zero exit instead.
          git add "${PUBLISHED[@]}"
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "🤖 Update job listings [skip ci]"

          # Anything still dirty was never published; drop it so the rebase
          # below does not refuse to run on a dirty tree.
          if ! git diff --quiet; then
            echo "::notice::Discarding unpublished working-tree changes: $(git diff --name-only | tr '\n' ' ')"
            git reset --hard --quiet HEAD
          fi

          # Rebase our single commit onto origin/main. Generated files that
          # conflict with upstream cannot be merged meaningfully, so abort and
          # fail; the next scheduled run regenerates them from the new main.
          sync_with_main() {
            git fetch origin main || return 1
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "::error::Rebase onto origin/main conflicted; nothing pushed. The next scheduled run will regenerate from the new main."
              return 1
            fi
          }

          # Last line of defence: never push conflict markers or broken JSON.
          verify_publishable() {
            local rc=0
            git grep -nE '^(<<<<<<<|>>>>>>>)( |$)' HEAD -- "${PUBLISHED[@]}" || rc=$?
            if [ "$rc" -ne 1 ]; then
              # 0 = markers found; >1 = git grep itself failed.
              echo "::error::Conflict markers in files to publish (or git grep failed, rc=${rc}); refusing to push."
              return 1
            fi
            if ! python3 -m json.tool data/market-history.json > /dev/null; then
              echo "::error::data/market-history.json is not valid JSON; refusing to push."
              return 1
            fi
          }

          sync_with_main || exit 1
          verify_publishable || exit 1

          # Push-only retry loop for concurrent-write races.
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              echo "✅ Push succeeded on attempt ${attempt}"
              exit 0
            fi
            echo "Push rejected on attempt ${attempt} (concurrent write race), retrying..."
            sleep 5
            # Another writer pushed; rebase onto it (failing loudly on conflict).
            sync_with_main || exit 1
            verify_publishable || exit 1
          done
          echo "::error::Failed to push updated job listings after 3 attempts."
          exit 1
