name: CI

# Job names (`lint`, `typecheck`, `test (3.11)`, `test (3.13)`, `site`) are
# used as required status checks — do not rename them.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'tests/**'
      - 'site/**'
      - 'config.yml'
      - 'pyproject.toml'
      - 'requirements*.txt'
      - '.github/workflows/**'
      - '.github/scripts/**'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  ACTIONLINT_VERSION: '1.7.12'
  ACTIONLINT_SHA256: '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8'

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements*.txt

      - name: Install locked dependencies
        run: python -m pip install --require-hashes -r requirements.txt -r requirements-dev.txt

      - name: Ruff
        run: ruff check --output-format=github

      - name: actionlint
        run: |
          tarball="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$tarball" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/$tarball"
          echo "${ACTIONLINT_SHA256}  $RUNNER_TEMP/$tarball" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color

      - name: Validate config
        run: python scripts/validate_config.py

      - name: Validate config.yml structure
        run: |
          python - <<'EOF'
          import yaml, sys
          with open("config.yml") as f:
              config = yaml.safe_load(f)
          required_keys = ["filtering", "apis", "readme"]
          for key in required_keys:
              if key not in config:
                  print(f"ERROR: Missing required top-level key in config.yml: '{key}'")
                  sys.exit(1)
          print("✅ config.yml is valid YAML with all required keys.")
          # Read nested company lists directly so a missing or malformed
          # apis.greenhouse.companies / apis.lever.companies schema fails loudly
          # instead of silently reporting zero companies.
          try:
              apis = config["apis"]
              greenhouse = apis["greenhouse"]["companies"]
              lever = apis["lever"]["companies"]
          except (KeyError, TypeError):
              print("ERROR: Invalid nested API schema in config.yml "
                    "(expected apis.greenhouse.companies and apis.lever.companies)")
              sys.exit(1)
          if not isinstance(greenhouse, list) or not isinstance(lever, list):
              print("ERROR: apis.greenhouse.companies and apis.lever.companies must be lists")
              sys.exit(1)
          print(f"   Greenhouse companies: {len(greenhouse)}")
          print(f"   Lever companies: {len(lever)}")
          EOF

      - name: Check for duplicate API URLs in config.yml
        run: |
          python - <<'EOF'
          import yaml, sys
          with open("config.yml") as f:
              config = yaml.safe_load(f)
          urls = []
          for section in ['greenhouse', 'lever', 'workday']:
              companies = config.get('apis', config).get(section, {}).get('companies', [])
              for c in companies:
                  url = c.get('url', c.get('workday_url', ''))
                  if url:
                      urls.append((section, c.get('name', ''), url))
          seen = {}
          duplicates = []
          for section, name, url in urls:
              if url in seen:
                  duplicates.append(f"  DUPLICATE: {url} ({name} in {section}) already defined as {seen[url]}")
              else:
                  seen[url] = f"{name} in {section}"
          if duplicates:
              print("❌ Duplicate API URLs found in config.yml:")
              for d in duplicates:
                  print(d)
              sys.exit(1)
          print(f"✅ No duplicate URLs found across {len(urls)} entries.")
          EOF

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Non-blocking until the scripts/ -> scripts/ngj/ refactor lands: the
    # current code base has ~31 pre-existing mypy errors. Flip this to false
    # once `mypy` is clean so the check actually gates merges.
    continue-on-error: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements*.txt

      - name: Install locked dependencies
        run: python -m pip install --require-hashes -r requirements.txt -r requirements-dev.txt

      - name: mypy
        run: mypy

  test:
    name: test (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13']
    env:
      HAS_CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN != '' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: requirements*.txt

      # Note: python-jobspy pins numpy==1.26.3, which ships no cp313 wheels, so
      # the 3.13 leg builds numpy from source once; pip's wheel cache (saved by
      # setup-python) keeps later runs fast.
      - name: Install locked dependencies
        run: |
          python -m pip install --require-hashes -r requirements.txt -r requirements-dev.txt
          python -m pip install -e . --no-deps

      # Coverage floor (fail_under) and report formats come from pyproject.toml.
      - name: Run tests with coverage
        run: pytest --junitxml=junit.xml -o junit_family=legacy

      - name: Upload coverage to Codecov
        if: ${{ !cancelled() && env.HAS_CODECOV_TOKEN == 'true' && matrix.python-version == '3.11' }}
        uses: codecov/codecov-action@e79a6962e0d4c0c17b229090214935d2e33f8354 # v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          flags: unittests
          name: coverage-report
          fail_ci_if_error: false
          verbose: true

      - name: Upload test results to Codecov
        if: ${{ !cancelled() && env.HAS_CODECOV_TOKEN == 'true' && matrix.python-version == '3.11' }}
        uses: codecov/test-results-action@0fa95f0e1eeaafde2c782583b36b28ad0d8c77d3 # v1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: unittests

  site:
    name: site
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Every step is guarded so this required check passes as a no-op until the
    # Vite app (site/package-lock.json) lands. hashFiles() is not available in
    # a job-level `if`, hence the per-step guards.
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Report skip
        if: hashFiles('site/package-lock.json') == ''
        run: echo "site/package-lock.json not found; skipping site checks."

      - name: Set up Node
        if: hashFiles('site/package-lock.json') != ''
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: site/package-lock.json

      - name: Install
        if: hashFiles('site/package-lock.json') != ''
        working-directory: site
        run: npm ci

      - name: Lint
        if: hashFiles('site/package-lock.json') != ''
        working-directory: site
        run: npm run lint

      - name: Test
        if: hashFiles('site/package-lock.json') != ''
        working-directory: site
        run: npm test -- --coverage

      - name: Build
        if: hashFiles('site/package-lock.json') != ''
        working-directory: site
        run: npm run build
