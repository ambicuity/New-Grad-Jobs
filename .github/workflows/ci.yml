name: CI

# Job names (`lint`, `typecheck`, `test (3.11)`, `test (3.13)`, `site`) are
# used as required status checks — do not rename them.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'tests/**'
      - 'site/**'
      - 'config.yml'
      - 'pyproject.toml'
      - 'requirements*.txt'
      - '.github/workflows/**'
      - '.github/scripts/**'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  ACTIONLINT_VERSION: '1.7.12'
  ACTIONLINT_SHA256: '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8'

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements*.txt

      - name: Install locked dependencies
        run: python -m pip install --require-hashes -r requirements.txt -r requirements-dev.txt

      - name: Ruff
        run: ruff check --output-format=github

      - name: actionlint
        run: |
          tarball="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$tarball" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/$tarball"
          echo "${ACTIONLINT_SHA256}  $RUNNER_TEMP/$tarball" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color

      # Schema-checks config.yml (required filtering keys, per-ATS company
      # shape/URL pattern/uniqueness, numeric ranges, enabled flags) and the
      # enabled-company threshold. Replaces the old inline structure check,
      # which still required the removed `readme:` section.
      - name: Validate config
        run: python scripts/validate_config.py

      - name: Check for duplicate API URLs in config.yml
        run: |
          python - <<'EOF'
          import yaml, sys
          with open("config.yml") as f:
              config = yaml.safe_load(f)
          urls = []
          for section in ['greenhouse', 'lever', 'workday']:
              companies = config.get('apis', config).get(section, {}).get('companies', [])
              for c in companies:
                  url = c.get('url', c.get('workday_url', ''))
                  if url:
                      urls.append((section, c.get('name', ''), url))
          seen = {}
          duplicates = []
          for section, name, url in urls:
              if url in seen:
                  duplicates.append(f"  DUPLICATE: {url} ({name} in {section}) already defined as {seen[url]}")
              else:
                  seen[url] = f"{name} in {section}"
          if duplicates:
              print("❌ Duplicate API URLs found in config.yml:")
              for d in duplicates:
                  print(d)
              sys.exit(1)
          print(f"✅ No duplicate URLs found across {len(urls)} entries.")
          EOF

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements*.txt

      - name: Install locked dependencies
        run: python -m pip install --require-hashes -r requirements.txt -r requirements-dev.txt

      - name: mypy
        run: mypy

  test:
    name: test (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13']
    env:
      HAS_CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN != '' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: requirements*.txt

      # Note: python-jobspy pins numpy==1.26.3, which ships no cp313 wheels, so
      # the 3.13 leg builds numpy from source once; pip's wheel cache (saved by
      # setup-python) keeps later runs fast.
      - name: Install locked dependencies
        run: |
          python -m pip install --require-hashes -r requirements.txt -r requirements-dev.txt
          python -m pip install -e . --no-deps

      # Coverage floor (fail_under) and report formats come from pyproject.toml.
      - name: Run tests with coverage
        run: pytest --junitxml=junit.xml -o junit_family=legacy

      - name: Upload coverage to Codecov
        if: ${{ !cancelled() && env.HAS_CODECOV_TOKEN == 'true' && matrix.python-version == '3.11' }}
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          flags: unittests
          name: coverage-report
          fail_ci_if_error: false
          verbose: true

      - name: Upload test results to Codecov
        if: ${{ !cancelled() && env.HAS_CODECOV_TOKEN == 'true' && matrix.python-version == '3.11' }}
        uses: codecov/test-results-action@0fa95f0e1eeaafde2c782583b36b28ad0d8c77d3 # v1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: unittests

  site:
    name: site
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Every step is guarded so this required check passes as a no-op until the
    # Vite app (site/package-lock.json) lands. hashFiles() is not available in
    # a job-level `if`, hence the per-step guards.
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Report skip
        if: hashFiles('site/package-lock.json') == ''
        run: echo "site/package-lock.json not found; skipping site checks."

      - name: Set up Node
        if: hashFiles('site/package-lock.json') != ''
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: site/package-lock.json

      - name: Install
        if: hashFiles('site/package-lock.json') != ''
        working-directory: site
        run: npm ci

      - name: Lint
        if: hashFiles('site/package-lock.json') != ''
        working-directory: site
        run: npm run lint

      - name: Test
        if: hashFiles('site/package-lock.json') != ''
        working-directory: site
        run: npm test -- --coverage

      - name: Build
        if: hashFiles('site/package-lock.json') != ''
        working-directory: site
        run: npm run build

      - name: Resolve Playwright version
        id: playwright
        if: hashFiles('site/package-lock.json') != ''
        working-directory: site
        run: echo "version=$(node -p "require('./node_modules/@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        if: hashFiles('site/package-lock.json') != ''
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      # Always run: on a cache hit the browser download is skipped, but the
      # system libraries (apt) still have to be installed on the fresh runner.
      - name: Install Playwright Chromium
        if: hashFiles('site/package-lock.json') != ''
        working-directory: site
        run: npx playwright install --with-deps chromium

      # Builds the fixture dataset and serves it with `vite preview` (see
      # site/playwright.config.js); every external request is mocked.
      - name: E2E tests
        if: hashFiles('site/package-lock.json') != ''
        working-directory: site
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure() && hashFiles('site/package-lock.json') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: |
            site/playwright-report/
            site/test-results/
          retention-days: 14
          if-no-files-found: ignore
