<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Fully automated list of new grad job opportunities from multiple company APIs, updated about every 30 minutes. Built by engineers, for engineers.">
  <meta name="keywords" content="new grad jobs, entry level jobs, software engineer jobs, tech jobs, 2025 jobs, 2026 jobs">
  <meta property="og:title" content="NGJ · New Grad Jobs">
  <meta property="og:description" content="Fully automated job board for new graduates powered by multiple live company APIs, updated about every 30 minutes.">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary_large_image">
  <title>NGJ · New Grad Jobs</title>

  <link rel="icon" type="image/svg+xml" href="favicon.svg">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://gc.zgo.at" crossorigin>
  <link rel="dns-prefetch" href="https://gc.zgo.at">
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="alternate" type="application/rss+xml" title="New Grad Jobs RSS Feed" href="feed.xml">

  <style>
    html, body { margin: 0; padding: 0; height: 100%; background: #000; color: #e8e8e8;
      font-family: "JetBrains Mono", ui-monospace, monospace;
      -webkit-font-smoothing: antialiased; }
    body { overflow-x: auto; }
    * { box-sizing: border-box; }
    #root { height: 100%; width: 100%; min-width: 1180px; }
    /* Mobile/tablet: drop the desktop 1180px canvas so the single-column reflow
       (driven by useIsMobile in the terminal views) fits the viewport with
       no sideways scroll. Breakpoint mirrors MOBILE_MAX_PX in use-viewport.jsx —
       it matches the desktop terminal's 1180px min-width, so any screen that
       can't fit the 3-column layout reflows instead of scrolling. */
    @media (max-width: 1180px) {
      body { overflow-x: hidden; }
      #root { min-width: 0; }
    }
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: #0a0a0a; }
    ::-webkit-scrollbar-thumb { background: #2a2a2a; }
    ::-webkit-scrollbar-thumb:hover { background: #3a3a3a; }
    input::placeholder { color: #5a5a5a; }
    button:focus-visible, input:focus-visible { outline: 1px solid #ff9d3d; outline-offset: 1px; }
    .ng-boot { padding: 24px; font-size: 12px; color: #ff9d3d; letter-spacing: 0.6px; }
    .ng-boot .dim { color: #6e6e6e; }
  </style>

  <!-- Production React builds. `defer` keeps these from blocking first paint of
       the boot line; deferred scripts still run in order before
       DOMContentLoaded, which is when Babel standalone compiles and runs the
       text/babel scripts below, so React/ReactDOM are defined by then. -->
  <script defer src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" integrity="sha384-DGyLxAyjq0f9SPpVevD6IgztCFlnMF6oW/XQGmfe+IsZ8TqEiDrcHkMLKI6fiB/Z" crossorigin="anonymous"></script>
  <script defer src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" integrity="sha384-gTGxhz21lVGYNMcdJOyq01Edg0jhn/c22nsx0kyqP0TxaV5WVdsSH1fSDUf5YJj1" crossorigin="anonymous"></script>
  <script defer src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script>
    window.loadAnalytics = function loadAnalytics() {
      if (window.goatcounter || document.querySelector('script[data-goatcounter]')) return;
      const s = document.createElement('script');
      s.async = true;
      s.dataset.goatcounter = 'https://riteshrana.goatcounter.com/count';
      s.src = 'https://gc.zgo.at/count.js';
      document.head.appendChild(s);
    };
    window.addEventListener('load', () => window.setTimeout(window.loadAnalytics, 3000), { once: true });
  </script>
</head>
<body>
  <div id="root">
    <div class="ng-boot">
      <div>NGJ <span class="dim">loading jobs-index.json …</span></div>
    </div>
  </div>

  <!-- Pure-JS helper for the LIVE chip, loadable in Node for unit testing. -->
  <script src="terminal/live-stamp-format.js?v=24"></script>

  <!-- Cache-bust the bundle when its shape changes. Bump v= on data-shape edits. -->
  <!-- useIsMobile must load before the views that branch on it for responsive reflow. -->
  <script type="text/babel" src="terminal/use-viewport.jsx?v=24"></script>
  <script type="text/babel" src="terminal/data.jsx?v=24"></script>
  <script type="text/babel" src="terminal/contributors-data.jsx?v=24"></script>
  <script type="text/babel" src="terminal/dashboard.jsx?v=24"></script>
  <script type="text/babel" src="terminal/contributors.jsx?v=24"></script>
  <script type="text/babel" src="terminal/live-stamp.jsx?v=24"></script>
  <script type="text/babel" src="terminal/app.jsx?v=24"></script>

  <script type="text/babel">
    // Mount as soon as jobs are in. Contributors (contributors.json + GitHub
    // API) keep loading in the background; that view shows its own loading
    // state until NGCONTRIB_READY settles.
    (async () => {
      try {
        await window.NGJOBS_READY;
      } catch (err) {
        console.error('[terminal] data bootstrap failed:', err);
      }
      ReactDOM.createRoot(document.getElementById('root')).render(
        <NGErrorBoundary><NGApp /></NGErrorBoundary>
      );
    })();
  </script>
</body>
</html>
