[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "new-grad-jobs"
version = "1.0.1"
description = "Automated new grad job aggregator scraping Greenhouse, Lever, Google Careers, and more."
requires-python = ">=3.11"
# Single source of truth for runtime dependencies. Compatible ranges live here;
# exact, hash-locked versions live in requirements.txt (regenerate with
# `make lock` after editing this list).
dependencies = [
    "requests>=2.32,<3",
    "PyYAML>=6.0.1,<7",
    "python-dateutil>=2.9,<3",
    "python-jobspy>=1.1.82,<2",
]

[project.optional-dependencies]
# Locked in requirements-dev.txt (`make lock`).
dev = [
    "pytest>=8.0,<10",
    "pytest-cov>=5.0",
    "ruff>=0.16,<0.17",  # keep in step with the ruff-pre-commit rev in .pre-commit-config.yaml
    "mypy>=1.10",
    "types-requests",
    "types-PyYAML",
    "types-python-dateutil",
    "pre-commit>=4.0",
]

[tool.setuptools]
# Nothing to package yet: the scraper runs as scripts. This keeps
# `pip install -e . --no-deps` working without setuptools auto-discovery
# tripping over the flat repo layout.
packages = []

# --------------------------------------------------------------------------- #
# pytest / coverage
# --------------------------------------------------------------------------- #
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --cov=scripts --cov-report=term-missing --cov-report=xml"
python_files = "test_*.py"
python_functions = "test_*"
markers = [
    "network: test is allowed to open real network connections (blocked by default in tests/conftest.py)",
    "real_sleep: test needs the real time.sleep (patched to a no-op by default in tests/conftest.py)",
]

[tool.coverage.run]
source = ["scripts"]
omit = ["tests/*", ".venv/*"]

[tool.coverage.report]
show_missing = true
# pytest enforces this floor (codecov statuses stay informational).
fail_under = 75

# --------------------------------------------------------------------------- #
# ruff (replaces flake8 + isort)
# --------------------------------------------------------------------------- #
[tool.ruff]
line-length = 120
target-version = "py311"
src = ["scripts", "tests", ".github/scripts"]
extend-exclude = ["docs", "site"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["scripts"]

