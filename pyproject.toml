# --------------------------------------------------------------------------- #
# mypy (non-strict; CI job is non-blocking until the scripts/ngj refactor lands)
# --------------------------------------------------------------------------- #
[tool.mypy]
python_version = "3.11"
files = ["scripts"]
ignore_missing_imports = true
check_untyped_defs = false
# scripts/ modules are imported both as `quality` and `scripts.quality`
# (try/except fallbacks); without this mypy refuses to run at all.
explicit_package_bases = true
warn_unused_configs = true
