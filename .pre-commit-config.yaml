# Hook revisions are frozen to commit SHAs (`pre-commit autoupdate --freeze`);
# the trailing comment records the release tag.
#
# Generated / scraped artifacts are skipped by every hook.
exclude: |
  (?x)^(
    data/market-history\.json|
    site/public/(jobs|jobs-index|health|contributors)\.json|
    site/public/feed\.xml|
    site/public/descriptions/.*|
    site/test/fixtures/.*
  )$

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # frozen: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ['--maxkb=2048']
      - id: detect-private-key
      - id: mixed-line-ending
        args: ['--fix=lf']

  # --- Python lint + import sorting (replaces flake8 + isort). Config: pyproject.toml.
  # Keep this rev in step with the ruff pin in requirements-dev.txt.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: 2eeb5678de71a00c0902cbda7105d328432f72cb  # frozen: v0.16.8
    hooks:
      - id: ruff-check
        args: ['--exit-non-zero-on-fix']

  # --- Secret Detection ---
  - repo: https://github.com/gitleaks/gitleaks
    rev: 2ca41cc1372d1e939a6a879f18cdc19fc1cac1ce  # frozen: v8.30.0
    hooks:
      - id: gitleaks
        name: Detect secrets (gitleaks)
